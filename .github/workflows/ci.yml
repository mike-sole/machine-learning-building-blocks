name: CI

on:
  push:
    branches: ['main']
  pull_request:
  workflow_dispatch:
    inputs:
      update-snapshots:
        description: 'Regenerate the Linux visual snapshots and commit them to this branch'
        type: boolean
        default: false
      rewrite-all-snapshots:
        description: 'With the above, rewrite every snapshot, not only those that fail the comparison'
        type: boolean
        default: false

# Jobs get a read-only token unless they ask for more
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, build and unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check and build
        run: npm run build

      - name: Unit tests
        run: npm run test:unit

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The release binary rather than gitleaks-action, checked against its published checksum
      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
          rm gitleaks.tar.gz

      # The whole history takes a few seconds, so scan it all rather than only this change
      - name: Scan for secrets
        run: ./gitleaks git --redact --verbose .

  e2e:
    name: Playwright tests
    runs-on: ubuntu-latest
    # Screenshots must be taken in the same environment as the committed baselines,
    # so pin the official image to the @playwright/test version in package-lock.json, by digest so
    # the tag can't be moved
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-noble@sha256:3bed4b1a12f2338642f3d8cba28e291deef3c66bd4a964bbeb3e57bbff511dbd
      options: --user 1001
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Playwright tests
        if: ${{ !inputs.update-snapshots }}
        run: npm run test:e2e

      - name: Update visual snapshots
        if: ${{ inputs.update-snapshots }}
        run: npx playwright test --update-snapshots=${{ inputs.rewrite-all-snapshots && 'all' || 'changed' }}

      - name: Upload updated snapshots
        if: ${{ inputs.update-snapshots }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-snapshots
          path: tests/**/*-linux.png

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  commit-snapshots:
    name: Commit updated snapshots
    needs: [build, e2e]
    if: ${{ inputs.update-snapshots }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Check out the tested commit, not the branch tip, so the push contains
      # only the tested code plus the new images
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Download updated snapshots
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-snapshots
          path: tests

      # Pushes made with GITHUB_TOKEN don't start CI by themselves: on a pull
      # request the run for this commit is held until a maintainer approves it
      # (see the README)
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add tests
          if git diff --cached --quiet; then
            echo 'No snapshot changes to commit'
            exit 0
          fi
          git commit -m 'Update Linux visual snapshots'
          # Refused if the branch moved since this run started
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
