name: CI

on:
  push:
    branches: ['main']
  pull_request:
  workflow_dispatch:
    inputs:
      update-snapshots:
        description: 'Regenerate the Linux visual snapshots and commit them to this branch'
        type: boolean
        default: false
      rewrite-all-snapshots:
        description: 'With the above, rewrite every snapshot, not only those that fail the comparison'
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, build and unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check and build
        run: npm run build

      - name: Unit tests
        run: npm run test:unit

  e2e:
    name: Playwright tests
    runs-on: ubuntu-latest
    # Screenshots must be taken in the same environment as the committed baselines,
    # so pin the official image to the @playwright/test version in package-lock.json
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-noble
      options: --user 1001
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Playwright tests
        if: ${{ !inputs.update-snapshots }}
        run: npm run test:e2e

      - name: Update visual snapshots
        if: ${{ inputs.update-snapshots }}
        run: npx playwright test --update-snapshots=${{ inputs.rewrite-all-snapshots && 'all' || 'changed' }}

      - name: Upload updated snapshots
        if: ${{ inputs.update-snapshots }}
        uses: actions/upload-artifact@v4
        with:
          name: linux-snapshots
          path: tests/**/*-linux.png

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  commit-snapshots:
    name: Commit updated snapshots
    needs: [build, e2e]
    if: ${{ inputs.update-snapshots }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Pushes made with GITHUB_TOKEN don't start workflows (on a pull request the
      # run is held for approval), so push with the snapshot bot app's token
      # instead and let CI run on the new commit as usual
      - name: Create app token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.SNAPSHOT_BOT_APP_ID }}
          private-key: ${{ secrets.SNAPSHOT_BOT_PRIVATE_KEY }}

      # Check out the tested commit, not the branch tip, so the push contains
      # only the tested code plus the new images
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Download updated snapshots
        uses: actions/download-artifact@v4
        with:
          name: linux-snapshots
          path: tests

      - name: Commit and push
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          user_id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${user_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          git add tests
          if git diff --cached --quiet; then
            echo 'No snapshot changes to commit'
            exit 0
          fi
          git commit -m 'Update Linux visual snapshots'
          # Refused if the branch moved since this run started
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
